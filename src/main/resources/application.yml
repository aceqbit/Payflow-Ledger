spring:
  application.name: payflow-ledger
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari.maximum-pool-size: ${DB_POOL:32}   # T2: 32 beat 16 in the tuning loop
  jpa.hibernate.ddl-auto: none
  flyway.enabled: true
  lifecycle.timeout-per-shutdown-phase: 25s

server.shutdown: graceful

ledger:
  # T4: the PESSIMISTIC transfer runs as one SQL function call (1 round trip instead of 8). Set false to use the Java path.
  transfer.sql-function: true

logging.structured.format.console: logstash

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  # All three signals go over OTLP to the Collector (Collector tail-samples, so the app samples 100%).
  otlp.metrics.export:
    url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    step: 5s
    base-time-unit: seconds   # Prometheus names must be *_seconds (dashboards, rules and alerts assume it)
  opentelemetry:
    tracing.export.otlp.endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging.export.otlp.endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    resource-attributes:
      service.name: payflow-ledger
      deployment.environment: ${ENV:local}
      run_id: ${RUN_ID:adhoc}
      scenario: ${SCENARIO:none}
  tracing.sampling.probability: 1.0
  metrics.distribution:
    percentiles-histogram.http.server.requests: true
    slo.hikaricp.connections.acquire: 250us,500us,1ms,2ms,5ms,25ms,100ms
