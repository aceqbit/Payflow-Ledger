    {
     "uid": "invariant-violation",
     "title": "InvariantViolation",
     "condition": "C",
     "for": "0s",
     "noDataState": "OK",
     "execErrState": "Error",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "InvariantViolation: max(ledger_invariant_violations) > 0"
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 600,
        "to": 0
       },
       "datasourceUid": "prometheus",
       "model": {
        "expr": "max(ledger_invariant_violations)",
        "instant": true,
        "refId": "A"
       }
      },
      {
       "refId": "B",
       "datasourceUid": "__expr__",
       "model": {
        "type": "reduce",
        "expression": "A",
        "reducer": "last",
        "refId": "B"
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "type": "threshold",
        "expression": "B",
        "refId": "C",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0
           ]
          }
         }
        ]
       }
      }
     ]
    },
