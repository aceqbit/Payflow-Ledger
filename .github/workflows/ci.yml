name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      PG_TEST_USER: ledger
      PG_TEST_PASSWORD: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # unit + jqwik 10k tries, then integration/concurrency/race/property tests (jqwik 10k), JaCoCo gate (80% on
      # ledger, payment, idempotency) and the OpenAPI snapshot test all run inside verify.
      - name: Build and test
        run: mvn -B verify -Djqwik.tries=10000 -Djqwik.it.tries=10000

      - name: Dependency vulnerabilities (OWASP)
        run: mvn -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=9 -DskipTests
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true   # advisory until an NVD API key is configured

      - name: Container image (Jib, no Docker daemon needed)
        run: mvn -B -DskipTests package jib:buildTar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
