# Same as prometheus.yml but for a Prometheus binary running on the host (no Docker).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  promote_resource_attributes:
    - service.name
    - run_id
    - scenario
    - deployment.environment

storage:
  exemplars:
    max_exemplars: 100000

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
