apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payflow.name" . }}
data:
  LEDGER_STRATEGY: {{ .Values.config.strategy | quote }}
  LEDGER_OUTBOX_MODE: {{ .Values.config.outboxMode | quote }}
  OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  ENV: {{ .Values.config.environment | quote }}
  RUN_ID: {{ .Values.config.runId | quote }}
  SCENARIO: {{ .Values.config.scenario | quote }}
