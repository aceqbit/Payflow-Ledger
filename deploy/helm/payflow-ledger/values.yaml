replicaCount: 2
image:
  repository: payflow-ledger
  tag: dev
  pullPolicy: IfNotPresent
service:
  port: 8080
resources:
  requests: {cpu: 500m, memory: 768Mi}
  limits: {memory: 1Gi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
config:
  strategy: PESSIMISTIC
  outboxMode: retain
  otlpEndpoint: http://otel-collector-opentelemetry-collector:4318
  environment: kind
  runId: adhoc
  scenario: none
# Dev defaults only. Provide real values with --set or an existing secret.
secret:
  create: true
  existingSecret: ""
  dbUrl: jdbc:postgresql://payflow-pg-rw:5432/ledger
  dbUser: ledger
  dbPassword: ledger
  jwtSecret: dev-only-secret-change-me-0123456789abcdef
