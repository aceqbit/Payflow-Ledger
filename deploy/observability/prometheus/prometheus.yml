global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Metrics arrive over OTLP (--web.enable-otlp-receiver); resource attributes become labels.
otlp:
  promote_resource_attributes:
    - service.name
    - run_id
    - scenario
    - deployment.environment

storage:
  exemplars:
    max_exemplars: 100000

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
