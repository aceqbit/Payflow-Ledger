name: payflow
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger}
      POSTGRES_DB: ledger
    command: ["postgres", "-c", "wal_level=logical", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledger} -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ["8474:8474", "15432:15432"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 20
  ledger-app:
    image: payflow-ledger:dev
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ledger}
      DB_USER: ${DB_USER:-ledger}
      DB_PASSWORD: ${DB_PASSWORD:-ledger}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      toxiproxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
