name: payflow
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger}
      POSTGRES_DB: ledger
    command: ["postgres", "-c", "wal_level=logical", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledger} -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ["8474:8474", "15432:15432"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DB_USER: ${DB_USER:-ledger}
      DB_PASSWORD: ${DB_PASSWORD:-ledger}
      TAIL_SAMPLE_PERCENT: ${TAIL_SAMPLE_PERCENT:-5}   # make chaos sets 100
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on:
      postgres: {condition: service_healthy}
      prometheus: {condition: service_started}
      tempo: {condition: service_started}
      loki: {condition: service_started}

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:3.6.20
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:12.4.14
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

  ledger-app:
    image: payflow-ledger:dev
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ledger}
      DB_USER: ${DB_USER:-ledger}
      DB_PASSWORD: ${DB_PASSWORD:-ledger}
      OTLP_ENDPOINT: http://otel-collector:4318
      RUN_ID: ${RUN_ID:-adhoc}
      SCENARIO: ${SCENARIO:-none}
      ENV: local
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      toxiproxy: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
